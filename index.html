<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨BL磕点终极XP测试（分步答题版｜支持多选）</title>
<style>
  :root{
    --bg-top:#fff5fb;
    --bg-bottom:#f6f0ff;
    --accent:#d88fc9;
    --accent-deep:#b886db;
    --ink:#3b2d52;
    --ink-soft:#4a3a5c;
    --ink-mute:#8a7a9e;
    --card-shadow:0 10px 30px rgba(184,80,160,.12);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 100%);
    color:var(--ink-soft);
    line-height:1.6;
    min-height:100vh;
  }

  /* ===== 视图容器（一次只显示一个，淡入淡出切换） ===== */
  .view{
    position:fixed;
    inset:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    opacity:0;
    visibility:hidden;
    transition:opacity .45s ease,visibility 0s linear .45s;
  }
  .view.active{
    opacity:1;
    visibility:visible;
    transition:opacity .45s ease;
  }
  .view-inner{
    max-width:680px;
    margin:0 auto;
    padding:28px 18px 56px;
    min-height:100%;
  }

  /* ===== 封面启动页 ===== */
  #view-cover{
    background:radial-gradient(circle at 50% 30%,#ffeaf6 0%,var(--bg-top) 46%,var(--bg-bottom) 100%);
  }
  .cover-wrap{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 24px;
  }
  .cover-glow{
    width:150px;
    height:150px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f6b8e0 0%,#d88fc9 55%,#b886db 100%);
    opacity:.85;
    margin-bottom:26px;
    box-shadow:0 18px 46px rgba(184,80,160,.35);
    animation:coverFloat 3.6s ease-in-out infinite;
  }
  @keyframes coverFloat{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-10px) scale(1.04); }
  }
  .cover-title{
    font-size:clamp(30px,8vw,42px);
    font-weight:800;
    color:var(--ink);
    letter-spacing:1px;
    line-height:1.35;
    text-shadow:0 4px 18px rgba(216,143,201,.25);
  }
  .cover-sub{
    margin-top:14px;
    font-size:clamp(16px,4.4vw,19px);
    font-weight:700;
    color:var(--accent-deep);
    letter-spacing:2px;
  }
  .cover-note{
    margin-top:16px;
    max-width:360px;
    font-size:14px;
    color:var(--ink-mute);
  }
  .btn-cover{
    margin-top:36px;
    min-width:220px;
  }

  /* ===== 按钮 ===== */
  .btn{
    min-height:50px;
    border:none;
    border-radius:999px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    padding:0 28px;
    transition:transform .15s ease,box-shadow .2s ease,filter .2s ease;
  }
  .btn:hover{ transform:scale(1.03); filter:brightness(1.06); }
  .btn:active{ transform:scale(.97); }
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    color:#fff;
    box-shadow:0 10px 24px rgba(184,80,160,.35);
  }
  .btn.ghost{
    background:#fff;
    color:var(--accent-deep);
    border:2px solid #eecfe8;
  }

  /* ===== 答题页 ===== */
  .progress-wrap{ margin-bottom:16px; }
  .progress-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:14px;
    font-weight:700;
    color:var(--accent-deep);
    margin-bottom:8px;
  }
  .progress-track{
    height:10px;
    border-radius:999px;
    background:#f0e2f6;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0;
    border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent-deep));
    transition:width .45s ease;
  }
  .q-card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:var(--card-shadow);
    margin-bottom:16px;
  }
  .q-body{ animation:fadeUp .4s ease; }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:none; }
  }
  .q-title{
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:14px;
    line-height:1.5;
  }
  .q-options{ display:flex; flex-direction:column; gap:4px; }

  .opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:13px 14px;
    border-radius:14px;
    cursor:pointer;
    transition:background .18s ease;
  }
  .opt:hover{ background:#fdf3fb; }
  .opt input{
    position:absolute;
    opacity:0;
    width:1px;
    height:1px;
    pointer-events:none;
  }
  .box{
    flex:none;
    width:22px;
    height:22px;
    border-radius:7px;
    border:2px solid #e3c6e6;
    background:#fff;
    position:relative;
    margin-top:2px;
    transition:background .18s ease,border-color .18s ease;
  }
  .opt input:checked + .box{
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    border-color:transparent;
  }
  .opt input:checked + .box::after{
    content:"";
    position:absolute;
    left:6px;
    top:3px;
    width:6px;
    height:10px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .opt input:focus-visible + .box{
    box-shadow:0 0 0 3px rgba(216,143,201,.35);
    outline:none;
  }
  .opt:has(input:checked){ background:#fbeef9; }
  .opt:has(input:checked) .opt-text{ color:#7c3f74; }
  .opt-text{
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink-soft);
    transition:color .18s ease;
  }
  .opt-letter{ font-weight:700; color:var(--ink); margin-right:5px; }
  .tag-hint{ color:#bd93c4; }

  .actions{
    display:flex;
    gap:12px;
    margin-top:4px;
  }
  .actions .btn{ flex:1; }

  /* ===== 加载过渡页 ===== */
  #view-loading{ background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 100%); }
  .loading-wrap{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 24px;
  }
  .load-orb{
    width:64px;
    height:64px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    animation:loadPulse 1.2s ease-in-out infinite;
    margin-bottom:26px;
    box-shadow:0 12px 30px rgba(184,80,160,.35);
  }
  @keyframes loadPulse{
    0%,100%{ transform:scale(1); opacity:.85; }
    50%{ transform:scale(1.18); opacity:1; }
  }
  .load-text{
    font-size:18px;
    font-weight:700;
    color:var(--ink);
    animation:fadeUp .8s ease .1s both;
    letter-spacing:1px;
  }

  /* ===== 结果页 ===== */
  .result-head{
    text-align:center;
    margin:6px 0 22px;
  }
  .result-head h2{
    font-size:clamp(22px,6vw,28px);
    font-weight:800;
    color:var(--ink);
  }
  .result-head p{
    margin-top:8px;
    font-size:14px;
    color:var(--ink-mute);
  }
  .res-card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:var(--card-shadow);
    margin-bottom:16px;
    animation:fadeUp .5s ease both;
  }
  .res-card:nth-child(2){ animation-delay:.08s; }
  .res-card:nth-child(3){ animation-delay:.16s; }
  .res-badge{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    padding:4px 14px;
    border-radius:999px;
    letter-spacing:.5px;
  }
  .res-title{
    font-size:22px;
    font-weight:800;
    color:var(--ink);
    margin:12px 0 8px;
  }
  .res-copy{
    font-size:14.5px;
    line-height:1.9;
    color:var(--ink-soft);
    white-space:pre-line;
  }
  .sub-block{
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed #eed9f2;
  }
  .sub-label{
    font-size:13px;
    font-weight:700;
    color:var(--accent-deep);
    margin-bottom:10px;
  }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    display:inline-flex;
    align-items:center;
    padding:6px 12px;
    border-radius:999px;
    background:#fbeef9;
    border:1px solid #f0d4ef;
    font-size:13px;
    color:#7c3f74;
    line-height:1.4;
  }
  .chip b{ font-weight:700; margin-right:5px; color:var(--accent-deep); }
  .result-actions{ margin-top:24px; display:flex; justify-content:center; }
  .result-actions .btn{ min-width:220px; }

  /* ===== 响应式 ===== */
  @media (max-width:520px){
    .view-inner{ padding:20px 14px 48px; }
    .q-card{ padding:16px; }
    .opt-text{ font-size:14px; }
    .actions{ flex-direction:row; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

  <!-- ===== 视图1：封面启动页 ===== -->
  <section class="view active" id="view-cover">
    <div class="cover-wrap">
      <div class="cover-glow" aria-hidden="true"></div>
      <h1 class="cover-title">✨BL磕点终极XP测试</h1>
      <p class="cover-sub">支持多选｜测测你的本命磕点</p>
      <p class="cover-note">纯娱乐脑洞测试，所有题目都可以多选，不用只选一项！</p>
      <button type="button" class="btn primary btn-cover" id="startBtn">开始测试</button>
    </div>
  </section>

  <!-- ===== 视图2：分步答题页 ===== -->
  <section class="view" id="view-quiz">
    <div class="view-inner">
      <div class="progress-wrap">
        <div class="progress-top">
          <span id="progressText">当前第 1 / 12 题</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="q-card" id="qCard"></div>
      <div class="actions">
        <button type="button" class="btn ghost" id="prevBtn">上一题</button>
        <button type="button" class="btn primary" id="nextBtn">下一题</button>
      </div>
    </div>
  </section>

  <!-- ===== 视图3：加载过渡页 ===== -->
  <section class="view" id="view-loading">
    <div class="loading-wrap">
      <div class="load-orb" aria-hidden="true"></div>
      <p class="load-text">正在解析你的XP磕点…</p>
    </div>
  </section>

  <!-- ===== 视图4：最终结果展示页 ===== -->
  <section class="view" id="view-result">
    <div class="view-inner">
      <div class="result-head">
        <h2>✨你的磕点报告出炉啦</h2>
        <p>本命标签 + 副磕点，一次看个够</p>
      </div>
      <div id="resultCards"></div>
      <div class="result-actions">
        <button type="button" class="btn primary" id="restartBtn">重新测试</button>
      </div>
    </div>
  </section>

    B:'本命美人攻！比起力量上的强势，你最先沦陷在颜值气质里。美人攻容貌惊艳，骨相优越，自带氛围感，可冷可柔可破碎。最戳你的反差是：他不只是好看的花瓶，本身实力强大、脑子清醒，美貌是他的加分项，不是全部。美人攻落泪、垂眸示弱这种破碎瞬间，对你杀伤力最大。\n适配搭配：美人攻×强受、美人攻×女王受；适配强强、救赎、破镜重圆。',
    C:'本命年下小狗攻！热烈直白的弟弟攻狠狠拿捏你。外表看着乖巧软萌像小奶狗，内心的爱意和占有欲一点都不少，不擅长藏心思，喜欢就会主动黏上去蹭、撒娇、直白表白。他会带着少年人的莽撞和真诚，努力追上成熟的受，想要被前辈偏爱、也拼尽全力保护前辈。年下直球永远戳你！\n适配搭配：年下小狗攻×年上受；适配互宠、天降、欢喜冤家。',
    D:'本命矮攻！你是反差感重度爱好者！完全不执着攻一定要高大魁梧。小个子的他自尊心强、脾气倔，看着小小的，护短的时候气场一米八。踮脚仰头吻受、抬头对视、受低头摸他头顶这些体型反差画面，是你的XP开关。矮攻不服输、不肯因为身高示弱的样子格外戳你。\n适配搭配：矮攻×美人受、矮攻×高个清冷受；适配欢喜冤家、互宠。',
    E:'本命温柔弱攻！你不太喜欢有压迫感的攻，偏爱情绪稳定、包容柔软的类型。他温和耐心，善于共情，不会强迫受，擅长好好沟通。他的强大不在气势，而在情绪内核稳定，能接住受所有的暴躁、委屈和尖锐，慢慢治愈对方。温柔是他的铠甲，不是软弱。\n适配搭配：温柔弱攻×桀骜受、温柔弱攻×毒舌受；适配救赎、互宠、竹马。',
    F:'本命忠犬攻！忠诚度是你最看重的点。他对外人疏离冷淡，边界感极强，全世界只偏向受一个人。他不善花哨的情话，爱意都藏在行动里，默默守护、随叫随到，受需要的时候永远第一个出现。他把受当成自己的全部信仰，愿意无条件迁就、支持。\n适配搭配：忠犬攻×女王受、忠犬攻×清冷受；适配互宠、救赎、竹马。',
    G:'本命疯批攻！你偏爱浓烈到极致、危险又迷人的爱意。他的爱脱离常规，偏执又炽热，爱恨分明，没有折中选项。他可以为了受对抗全世界，骨子里带着野性疯狂。你很吃疯批和疯批强强对峙拉扯，两个人互相牵制、彼此是唯一能驯服对方的人。疯批的温柔只给心上人，这种专属感上头！\n适配搭配：疯批攻×疯批受、疯批攻×诱受；适配强强、强制爱、救赎。',

    J:'本命骚攻！嘴甜会撩、风趣鲜活的攻最对你胃口。他很会说情话，爱逗受，总喜欢看受被撩得耳尖发红的样子，看着吊儿郎当不正经，底线很清晰，专一起来超级靠谱。他擅长调节气氛，吵架也能用玩笑缓和，热烈又鲜活，爱意直白有趣不沉闷。\n适配搭配：骚攻×毒舌受、骚攻×傲娇受；适配欢喜冤家、天降。',

    M:'本命病弱攻！美强惨攻爱好者报到！他身体孱弱单薄，容易病痛，看着易碎，但是头脑聪慧、内心坚韧有主见，一点都不软弱。他没办法用力量保护爱人，但是心思通透，总能给受精神支撑。你很吃受小心翼翼照顾他、偏爱他的模式，是受宠攻热门人选！\n适配搭配：病弱攻×强壮护短受；适配受宠攻、救赎、竹马。',

    i:'腹黑白切黑受！外表温和乖巧，心思藏得很深，不动声色就能拿捏攻。看着温顺无害，心里算盘清楚，擅长攻心，悄悄把攻拿捏住，反差感很妙，经常能反向掌控节奏。',
    j:'疯批受野性桀骜，危险迷人，很难驯服，骨子里带着野性。不喜欢被束缚，和疯批攻强强对峙，两个人同样偏执强悍，互相征服、彼此牵制，危险又致命的吸引力，强强拉扯爱好者狂喜！',
    k:'美强惨受天花板！颜值高、能力强，但是过往满身伤痕，命运坎坷。他明明很强，却受过很多苦，坚韧地扛下一切。你一边被他的强大吸引，一边心疼他的遭遇，很吃有人把他从苦难里拉出来的救赎剧情，渣攻火葬场标配受！',
    l:'天然受心思单纯迟钝，共情力干净通透，经常无意识撩攻，自己完全没察觉。懵懵懂懂的样子自带萌感，很容易把腹黑攻钓得死死的，懵懂和腹黑的反差，甜感十足！',
    m:'娇气受容易委屈、怕疼，感知细腻，需要被细心呵护。不是矫情，是情绪直白，委屈会红眼眶，开心会明显表现出来。适合温柔攻、忠犬攻细心呵护，甜宠氛围感拉满！',
    n:'毒舌受刀子嘴豆腐心！嘴上吐槽不停，句句犀利，但是内心柔软善良。嘴上不饶人，别人真出事他第一个帮忙。和骚攻、傲娇攻搭配互怼日常，欢喜冤家效果绝佳！'
  };

  /* ===== 剧情结果文案库 ===== */
  var PLOT_TEXT={
    '①':'势均力敌是你的TOP！两个人实力、心智对等，没有谁依附谁，彼此是对手也是爱人。拉扯博弈，互相试探，谁都不会完全退让，张力满满。强强可以是温柔相爱，也可以是疯批对峙，重点是平等强大！',
    '②':'你热爱平等无固定攻受！不被攻受标签束缚，爱意不分上下，两个人可以自由切换，跟着情绪、氛围走，相爱优先，标签其次，自由磕糖，拒绝死板固定人设！',
    '③':'虐攻流爱好者！前期错过伤害，后期无尽悔恨，渣攻放下所有尊严去弥补、去挽回。重点看攻承受失去的痛苦、自我反省、拼命付出的过程，结局HE或者带遗憾都可以，核心是虐攻！',
    '④':'反转款！常规模式反过来，受是更成熟强大的一方，主动照顾、偏爱、包容攻。攻可以是病弱、小狗、傲娇，被受好好捧在手心里疼，这种反向宠爱新鲜感拉满！',
    '⑤':'双向奔赴天花板！没有单方面一直付出，两个人互相心疼、互相照顾，你体谅我的难处，我包容你的缺点。细水长流，甜而不腻，稳定温暖，是你的舒适区！',
    '⑥':'吵出来的爱情！两个人一见面就拌嘴互怼，看对方不顺眼，打打闹闹，在一次次交锋里慢慢动心。嘴上互损，心里慢慢在意，轻松有趣，不沉重！',
    '⑦':'你很吃彼此是对方的光！两个人都带着伤痕，遇见之后互相治愈，把对方从黑暗里拉出来。爱意是治愈伤口的良药，温柔又厚重，宿命感很强。',
    '⑧':'兜兜转转还是你！曾经因为误会、伤害分开，各自沉淀成长，久别重逢。隔阂还在，爱意也还在，一边解开过往心结，一边重新爱上，自带遗憾和宿命感。',
    '⑨':'长久陪伴型！从小一起长大，熟悉彼此所有样子，感情慢慢发酵，日久生情。没有突如其来的轰轰烈烈，是细水长流，知根知底，安稳踏实。',
    '⑩':'一眼沦陷！突如其来的心动，闯入原本平静的生活，热烈、冲击力强。萍水相逢，却一眼认定，浪漫又有宿命感！',
    '⑪':'浓烈的占有羁绊！带着强迫、禁锢的拉扯感，爱意裹挟着偏执，张力拉满。重点是强烈的宿命拉扯，爱恨交织，氛围感浓厚！',
    '⑫':'执念与遗憾美学！他把眼前人当成白月光的影子，前期是虚假的投射，后期分不清是执念还是真心。虐感很重，带着遗憾、纠结，氛围感很绝！'
  };

  /* ===== 状态 ===== */
  var picked={};          // 勾选数据（本地 js 变量，按勾选先后顺序保存，切题不丢失）
  var cur=0;              // 当前题号（0-11）

  var viewQuiz=document.getElementById('view-quiz');
  var qCard=document.getElementById('qCard');
  var progressText=document.getElementById('progressText');
  var progressFill=document.getElementById('progressFill');
  var prevBtn=document.getElementById('prevBtn');
  var nextBtn=document.getElementById('nextBtn');
  var resultCards=document.getElementById('resultCards');

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ===== 视图切换（淡入淡出，一次只显示一个） ===== */
  function showView(id){
    var views=document.querySelectorAll('.view');
    for(var i=0;i<views.length;i++) views[i].classList.remove('active');
    var v=document.getElementById(id);
    v.classList.add('active');
    v.scrollTop=0;
  }

  /* ===== 渲染当前题目 ===== */
  function renderQuestion(){
    if(!picked[cur]) picked[cur]=[];
    var q=QUESTIONS[cur];
    var html='';
    for(var i=0;i<q.opts.length;i++){
      var o=q.opts[i];
      var tag=o.tag?'<span class="tag-hint">【'+esc(o.tag)+'】</span>':'';
      var dot=(o.dot===false)?'':'.';
      var checked=(picked[cur].indexOf(o.k)>-1)?' checked':'';
      html+='<label class="opt"><input type="checkbox" data-k="'+esc(o.k)+'"'+checked+'><span class="box" aria-hidden="true"></span><span class="opt-text"><span class="opt-letter">'+esc(o.k)+dot+'</span>'+esc(o.t)+tag+'</span></label>';
    }
    qCard.innerHTML='<div class="q-body"><h2 class="q-title">'+(cur+1)+'. '+esc(q.title)+'</h2><div class="q-options">'+html+'</div></div>';

    progressText.textContent='当前第 '+(cur+1)+' / 12 题';
    progressFill.style.width=Math.round((cur+1)/12*100)+'%';
    prevBtn.style.visibility=(cur===0)?'hidden':'visible';
    nextBtn.textContent=(cur===11)?'提交查看结果':'下一题';
  }

  /* ===== 勾选事件（事件委托，保存勾选顺序） ===== */
  qCard.addEventListener('change',function(e){
    if(!e.target.matches('input[type="checkbox"]')) return;
    var k=e.target.getAttribute('data-k');
    if(!picked[cur]) picked[cur]=[];
    var arr=picked[cur];
    var idx=arr.indexOf(k);
    if(e.target.checked){
      if(idx===-1) arr.push(k);          // 记录勾选先后顺序
    }else{
      if(idx>-1) arr.splice(idx,1);
    }
  });

  /* ===== 结果卡片 ===== */
  function resCard(badge,mainKey,nameMap,textMap,subList,subLabel,emptyText){
    var html='<div class="res-card"><span class="res-badge">'+esc(badge)+'</span>';
    if(mainKey){
      html+='<div class="res-title">'+esc(nameMap[mainKey])+'</div><p class="res-copy">'+esc(textMap[mainKey])+'</p>';
    }else{
      html+='<div class="res-title">暂未解锁</div><p class="res-copy">'+esc(emptyText)+'</p>';
    }
    if(subList.length){
      html+='<div class="sub-block"><div class="sub-label">'+esc(subLabel)+'</div><div class="chips">';
      for(var i=0;i<subList.length;i++){
        var k=subList[i];
        html+='<span class="chip"><b>'+esc(k)+'</b>'+esc(nameMap[k])+'</span>';
      }
      html+='</div></div>';
    }
    return html+'</div>';
  }

  function renderResults(){
    var g=picked[0]||[];
    var s=picked[1]||[];
    var p=picked[10]||[];

    var html='';
    html+=resCard('本命主攻',g[0],GONG_NAMES,GONG_TEXT,g.slice(1),'副磕攻','这轮没有勾选攻选项，本命主攻暂未解锁～');
    html+=resCard('本命主受',s[0],SHOU_NAMES,SHOU_TEXT,s.slice(1),'副磕受','这轮没有勾选受选项，本命主受暂未解锁～');
    html+=resCard('本命剧情',p[0],PLOT_NAMES,PLOT_TEXT,p.slice(1),'副剧情偏好','这轮没有勾选剧情选项，本命剧情暂未解锁～');
    resultCards.innerHTML=html;
  }

  /* ===== 开始测试 ===== */
  document.getElementById('startBtn').addEventListener('click',function(){
    cur=0;
    renderQuestion();
    showView('view-quiz');
  });

  /* ===== 上一题 / 下一题 / 提交 ===== */
  prevBtn.addEventListener('click',function(){
    if(cur>0){ cur--; renderQuestion(); }
  });
  nextBtn.addEventListener('click',function(){
    if(cur<11){ cur++; renderQuestion(); }
    else{
      showView('view-loading');
      setTimeout(function(){
        renderResults();
        showView('view-result');
      },2000);
    }
  });

  /* ===== 重新测试 ===== */
  document.getElementById('restartBtn').addEventListener('click',function(){
    picked={};
    cur=0;
    showView('view-cover');
  });
})();
</script>
</body>
</html>
